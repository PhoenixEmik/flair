name: flair_conda_env
channels:
  - conda-forge
  - bioconda
  - conda

# FLAIR supports Python 3.12 through 3.14. Keep the reference environment on
# the oldest supported version.
dependencies:
  - python =3.12
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  - pip
  - pip:
      - flair-brookslab==v3.0.0+master
      - matplotlib>=3.10.0,<4.0.0
